name: Muse integration build check
on:
  push:
    branches:
      - feature/muse-scan-integration
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Consultation routing security tests
        run: bun test src/lib/consultations/rules.test.ts src/lib/workspace.functions.test.ts src/lib/clinic-scan-scope.test.ts
      - name: Build
        run: bun run build
